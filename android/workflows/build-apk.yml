name: Build CrossLink APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Copy APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CrossLink-v1.0.${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossLink-apk
          path: CrossLink-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CrossLink v1.0.${{ github.run_number }}
          body: |
            ### CrossLink Android APK Release
            - Material 3 Expressive UI
            - リアルタイムクリップボード同期
            - クイックファイル転送
            - 通知ミラーリング
            - メディアコントロール＆端末呼び出し
          files: CrossLink-*.apk
          make_latest: true
